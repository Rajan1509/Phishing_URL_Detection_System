<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phishing URL Detection System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #F5F6F8;
        --surface: #FFFFFF;
        --border: #E2E5EA;
        --ink: #131B2E;
        --muted: #5B6472;
        --accent: #2F5FFF;
        --accent-dim: #EAEFFF;
        --safe: #1A7F4E;
        --safe-bg: #EAF7F0;
        --danger: #C1352B;
        --danger-bg: #FCEBE9;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 20px 64px;
      }

      .top-bar {
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--accent), #7C9CFF);
      }

      .wrap {
        width: 100%;
        max-width: 640px;
        margin-top: 72px;
      }

      .eyebrow-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }

      .mark {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
      }

      .eyebrow-row span {
        font-size: 14px;
        color: var(--muted);
        letter-spacing: 0.01em;
      }

      h1 {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.25;
        margin: 0 0 10px;
        letter-spacing: -0.01em;
      }

      .sub {
        font-size: 15px;
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 40px;
        max-width: 46ch;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 32px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 8px;
      }

      .input-row {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-row svg {
        position: absolute;
        left: 14px;
        width: 16px;
        height: 16px;
        color: var(--muted);
        pointer-events: none;
      }

      input[type="text"] {
        width: 100%;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 14px;
        color: var(--ink);
        background: #FBFBFC;
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 13px 14px 13px 40px;
        outline: none;
        transition: border-color 0.12s ease, background 0.12s ease;
      }

      input[type="text"]::placeholder {
        color: #A5ABB6;
        font-family: 'Inter', sans-serif;
      }

      input[type="text"]:focus {
        border-color: var(--accent);
        background: #fff;
        box-shadow: 0 0 0 3px var(--accent-dim);
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 22px;
      }

      button {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        border-radius: 7px;
        padding: 12px 22px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease;
      }

      button:active { transform: scale(0.98); }

      #scanBtn {
        background: var(--ink);
        color: #fff;
        flex: 1;
      }

      #scanBtn:hover { background: #232E45; }

      #resetBtn {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
      }

      #resetBtn:hover { border-color: #C7CBD3; color: var(--ink); }

      .hint {
        font-size: 12.5px;
        color: #889099;
        margin-top: 14px;
        line-height: 1.5;
      }

      /* Result panel, replaces the bootstrap modal */
      .result-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(19, 27, 46, 0.45);
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
      }

      .result-overlay.open { display: flex; }

      .result-panel {
        background: #fff;
        border-radius: 10px;
        max-width: 420px;
        width: 100%;
        padding: 28px;
        border: 1px solid var(--border);
      }

      .result-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12.5px;
        font-weight: 600;
        padding: 6px 11px;
        border-radius: 6px;
        margin-bottom: 16px;
      }

      .result-badge.is-safe { background: var(--safe-bg); color: var(--safe); }
      .result-badge.is-danger { background: var(--danger-bg); color: var(--danger); }
      .result-badge.is-neutral { background: var(--accent-dim); color: var(--accent); }

      .result-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      #resultMessage {
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
        margin: 0 0 24px;
      }

      .result-panel .close-btn {
        width: 100%;
        background: var(--ink);
        color: #fff;
      }

      .result-panel .close-btn:hover { background: #232E45; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="top-bar"></div>

    <div class="wrap">
      <div class="eyebrow-row">
        <svg class="mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 3L28 7.5V15C28 22.5 23.4 27.9 17 30.5C10.6 27.9 6 22.5 6 15V7.5L17 3Z" stroke="#2F5FFF" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M12.5 16.8L15.6 19.9L21.8 13.2" stroke="#2F5FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span><b>Phishing URL Detection System</b></span>
      </div>

      <h1>Check a URL before you trust it</h1>
      <p class="sub">Paste a web address below and the model will assess whether it shows the patterns of a phishing site.</p>

      <div class="card">
        <form method="POST" action="/" id="urlForm">
          <label for="url">Website URL</label>
          <div class="input-row">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 10a2 2 0 0 0 3 1.7l2.6-2.6a2 2 0 0 0-2.8-2.8l-1 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M12 10a2 2 0 0 0-3-1.7L6.4 10.9a2 2 0 0 0 2.8 2.8l1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input name="url" id="url" type="text" required placeholder="https://example.com/login" />
          </div>

          <div class="actions">
            <button type="submit" id="scanBtn">Scan URL</button>
            <button type="reset" id="resetBtn">Reset</button>
          </div>

          <p class="hint">Nothing is stored. The URL is only used to generate this prediction.</p>
        </form>
      </div>
    </div>

    <!-- result panel - start -->
    <div class="result-overlay" id="resultOverlay">
      <div class="result-panel">
        <span class="result-badge is-neutral" id="resultBadge">
          <span class="dot"></span>
          <span id="resultBadgeText">Result</span>
        </span>
        <p id="resultMessage"></p>
        <button type="button" class="close-btn" id="closeResult">Close</button>
      </div>
    </div>
    <!-- result panel - end -->

    <script>
      function openResult(message) {
        const overlay = document.getElementById('resultOverlay');
        const text = document.getElementById('resultMessage');
        const badge = document.getElementById('resultBadge');
        const badgeText = document.getElementById('resultBadgeText');

        text.textContent = message;

        // Colour the badge based on keywords in the prediction, without
        // assuming a fixed backend vocabulary.
        const lower = message.toLowerCase();
        badge.classList.remove('is-safe', 'is-danger', 'is-neutral');
        if (lower.includes('phish') || lower.includes('malicious') || lower.includes('unsafe')) {
          badge.classList.add('is-danger');
          badgeText.textContent = 'Likely phishing';
        } else if (lower.includes('legit') || lower.includes('safe')) {
          badge.classList.add('is-safe');
          badgeText.textContent = 'Looks safe';
        } else {
          badge.classList.add('is-neutral');
          badgeText.textContent = 'Result';
        }

        overlay.classList.add('open');
      }

      document.addEventListener('DOMContentLoaded', function () {
        const predictValue = {{ predict|tojson }};
        if (predictValue) {
          openResult(predictValue);
        }
      });

      document.getElementById('closeResult').addEventListener('click', function () {
        document.getElementById('resultOverlay').classList.remove('open');
      });

      document.getElementById('resultOverlay').addEventListener('click', function (e) {
        if (e.target === this) this.classList.remove('open');
      });

      document.getElementById('urlForm').addEventListener('submit', function (e) {
        const urlInput = document.getElementById('url');
        if (!urlInput.value.trim()) {
          e.preventDefault();
          openResult('Please enter a URL before submitting.');
        }
      });
    </script>
  </body>
</html>
